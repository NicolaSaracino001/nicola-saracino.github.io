<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications | Nicola Saracino</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --bio-color: #2ea043;
        }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }
        header { text-align: center; padding: 60px 20px 40px; background: linear-gradient(180deg, rgba(22,27,34,1) 0%, rgba(13,17,23,1) 100%); border-bottom: 1px solid #30363d; }
        h1 { font-size: 2.5em; margin: 0; background: -webkit-linear-gradient(45deg, var(--accent), var(--bio-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Menu di Navigazione */
        .nav { margin-top: 20px; }
        .nav a { color: var(--text-main); text-decoration: none; margin: 0 15px; font-weight: bold; padding: 5px 10px; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .nav a:hover, .nav a.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        /* Stile Sezione Certificati */
        .cert-section { margin-bottom: 50px; background-color: var(--card-bg); border: 1px solid #30363d; border-radius: 10px; padding: 30px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
        @media (max-width: 768px) { .cert-section { flex-direction: column; } }
        .cert-content { flex: 1; }
        .cert-section h2 { color: var(--accent); margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 20px; }
        
        .cert-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #30363d; }
        .cert-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .cert-item h3 { margin: 0 0 5px 0; color: #fff; }
        .cert-item p { margin: 0 0 15px 0; color: #8b949e; font-size: 0.9em; }
        
        .verify-btn { display: inline-block; background-color: transparent; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85em; font-weight: bold; transition: all 0.3s; }
        .verify-btn:hover { background-color: var(--accent); color: #fff; }
        
        /* QR Code Statico */
        .qr-code { background: #fff; padding: 10px; border-radius: 8px; width: 120px; height: 120px; flex-shrink: 0; text-align: center; }
        .qr-code img { width: 100%; height: 100%; display: block; object-fit: contain; }
    </style>
</head>
<body>
    <header>
        <h1>Nicola Saracino</h1>
        <div class="nav">
            <a href="index.html">Projects</a>
            <a href="certifications.html" class="active">Certifications</a>
        </div>
    </header>

    <div class="container" id="certifications-container">
        <!-- Generato dinamicamente da JS -->
    </div>

    <!-- Script e Dati -->
    <script src="certifications_data.js"></script>
    <script>
        const container = document.getElementById('certifications-container');

        certificationsData.forEach(tool => {
            // Ignora se la sezione è vuota
            if (!tool.certs || tool.certs.length === 0) return;

            const section = document.createElement('div');
            section.className = 'cert-section';
            section.id = tool.id; // Ancoraggio diretto, es: #claude-code

            let certsHtml = `<div class="cert-content"><h2>${tool.title}</h2>`;
            
            tool.certs.forEach(cert => {
                certsHtml += `
                    <div class="cert-item">
                        <h3>${cert.name}</h3>
                        <p>${cert.provider} • ${cert.year}</p>
                        <a href="${cert.link}" target="_blank" class="verify-btn" rel="noopener">Verify credential ➔</a>
                    </div>
                `;
            });
            certsHtml += `</div>`;

            // Aggiunge l'immagine del QR code generata staticamente in locale
            certsHtml += `
                <div class="qr-code">
                    <img src="assets/qr-${tool.id}.png" alt="QR Code">
                </div>
            `;

            section.innerHTML = certsHtml;
            container.appendChild(section);
        });
    </script>
</body>
</html>
